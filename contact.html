<form name="sentMessage" id="contactForm" class="contact-form" novalidate>
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="field">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>
  </div>

  <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

  <div>
    <button type="submit" class="btn btn-primary" id="sendMessageButton">Send</button>
  </div>
</form>

<script>
  (function () {
    var form = document.getElementById('contactForm');
    var status = document.getElementById('form-status');
    var btn = document.getElementById('sendMessageButton');
    if (!form) return;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.reportValidity()) return;

      var data = new FormData(form);
      btn.disabled = true;
      status.className = 'form-status';
      status.textContent = 'Sending...';

      fetch('https://formspree.io/{{ site.email }}', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(function (res) {
        if (res.ok) {
          status.className = 'form-status is-success';
          status.textContent = 'Your message has been sent.';
          form.reset();
        } else {
          throw new Error('bad response');
        }
      }).catch(function () {
        status.className = 'form-status is-error';
        status.textContent = 'Sorry, the mail server did not respond. Try again later.';
      }).finally(function () {
        btn.disabled = false;
      });
    });
  })();
</script>
