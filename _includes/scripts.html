<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

<script src="{{ '/assets/scripts.js' | relative_url }}" defer></script>
<script src="{{ '/assets/terminal.js' | relative_url }}" defer></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (document.getElementById('particles') && typeof tsParticles !== 'undefined') {
      tsParticles.load('particles', {
        fullScreen: { enable: false },
        background: { color: 'transparent' },
        particles: {
          number: { value: 80, density: { enable: true, area: 800 } },
          color: { value: '#d4243b' },
          shape: { type: 'square' },
          opacity: { value: 0.4, random: { enable: true, minimumValue: 0.1 } },
          size: { value: 5, random: { enable: true, minimumValue: 2 } },
          move: {
            enable: true,
            speed: 0.4,
            direction: 'none',
            random: true,
            straight: false,
            outModes: 'out'
          },
          links: { enable: false }
        },
        detectRetina: true
      });
    }
  });
</script>

<script>
  (function () {
    var KEY = 'vaporwave-mode';
    var VWAVE_COLORS = ['#e61fa0', '#b967ff', '#ffffff'];
    var DARK_COLOR = '#d4243b';

    function applyMode(on) {
      document.documentElement.classList.toggle('vaporwave', on);
      var btn = document.getElementById('vaporwave-toggle');
      if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      updateParticles(on);
      syncAvatar(on);
    }

    function syncAvatar(on) {
      var avatar = document.getElementById('avatar-img');
      if (avatar) {
        avatar.src = on ? '/img/vaporwave_curt.png' : '/img/curt.png';
      }
    }

    function updateParticles(on) {
      if (typeof tsParticles === 'undefined') return;
      var c = tsParticles.domItem(0);
      if (!c) return;
      c.options.particles.color.value = on ? VWAVE_COLORS : DARK_COLOR;
      c.options.particles.shape.type = on ? 'circle' : 'square';
      c.refresh();
    }

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('vaporwave-toggle');
      var on = document.documentElement.classList.contains('vaporwave');
      if (btn) {
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.addEventListener('click', function () {
          var next = !document.documentElement.classList.contains('vaporwave');
          applyMode(next);
          try { localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) {}
        });
      }
      syncAvatar(on);
      if (on) updateParticles(true);
    });
  })();
</script>
