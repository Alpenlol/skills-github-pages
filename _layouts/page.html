---
layout: default
---

{% if page.background %}
<header class="masthead" style="background-image: url('{{ page.background }}')">
{% else %}
<header class="masthead">
{% endif %}
  <div class="overlay"></div>
  <div id="particles"></div>
  <div class="container">
    <div class="content">
      <div class="page-heading">
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <span class="subheading">{{ page.description }}</span>
        {% endif %}
      </div>
    </div>
  </div>
</header>

<main class="container">
  <div class="content">
    {{ content }}
  </div>
</main>
